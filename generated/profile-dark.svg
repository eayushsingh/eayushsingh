<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 860" width="100%" height="auto">
  <defs>
    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        fill: #c9d1d9;
      }
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        font-weight: 500;
        fill: #8b949e;
      }
      .accent-blue { fill: #58a6ff; font-weight: 500; }
      .accent-green { fill: #3fb950; font-weight: 600; }
      .accent-section { fill: #79c0ff; font-weight: 600; }
      .text-dim { fill: #7d8590; }
      .text-leader { fill: #21262d; }
      .text-bright { fill: #f0f6fc; }
      .ascii-art {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 5.2px;
        line-height: 9.8px;
        fill: #c9d1d9;
        white-space: pre;
      }
      .divider { stroke: #30363d; stroke-width: 1; }
      .subtle-divider { stroke: #21262d; stroke-width: 1; }
      .cursor { fill: #3fb950; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="798" height="858" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Minimal Header Bar -->
  <rect x="1" y="1" width="798" height="30" rx="6" fill="#161b22" />
  <rect x="1" y="19" width="798" height="12" fill="#161b22" />
  <line x1="1" y1="31" x2="799" y2="31" class="divider" />

  <!-- Subtle Traffic Lights -->
  <circle cx="16" cy="16" r="3.5" fill="#ff5f56" />
  <circle cx="28" cy="16" r="3.5" fill="#ffbd2e" />
  <circle cx="40" cy="16" r="3.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="400" y="20" text-anchor="middle" class="title">ayushsingh ~</text>

  <!-- Vertical Splitter -->
  <line x1="310" y1="31" x2="310" y2="859" class="divider" />


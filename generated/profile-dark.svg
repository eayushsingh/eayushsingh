<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="100%" height="100%">
  <defs>
    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #c9d1d9;
      }
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 12px;
        font-weight: 500;
        fill: #8b949e;
      }
      .accent-blue { fill: #58a6ff; font-weight: 500; }
      .accent-green { fill: #3fb950; font-weight: 600; }
      .accent-section { fill: #79c0ff; font-weight: 600; }
      .text-dim { fill: #7d8590; }
      .text-leader { fill: #21262d; }
      .text-bright { fill: #f0f6fc; }
      .ascii-art {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 10px;
        line-height: 13px;
        fill: #c9d1d9;
        white-space: pre;
      }
      .divider { stroke: #30363d; stroke-width: 1; }
      .subtle-divider { stroke: #21262d; stroke-width: 1; }
      .cursor { fill: #3fb950; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="858" height="578" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />

  <!-- Minimal Header Bar -->
  <rect x="1" y="1" width="858" height="30" rx="6" fill="#161b22" />
  <rect x="1" y="19" width="858" height="12" fill="#161b22" />
  <line x1="1" y1="31" x2="859" y2="31" class="divider" />

  <!-- Subtle Traffic Lights -->
  <circle cx="18" cy="16" r="3.5" fill="#ff5f56" />
  <circle cx="30" cy="16" r="3.5" fill="#ffbd2e" />
  <circle cx="42" cy="16" r="3.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="430" y="20" text-anchor="middle" class="title">ayushsingh ~</text>

  <!-- Vertical Splitter -->
  <line x1="335" y1="31" x2="335" y2="579" class="divider" />

  <!-- ================= LEFT: FULL ASCII PORTRAIT & CONTACT ================= -->
  <g transform="translate(14, 40)">
    <text class="ascii-art" xml:space="preserve">      <tspan x="4" y="12">          ;=+*+=++=+=;;;                </tspan>
      <tspan x="4" y="25.5">          ;=++==++=++;::                </tspan>
      <tspan x="4" y="39">         #%@%@@@@%++;:::                </tspan>
      <tspan x="4" y="52.5">         %%%@@@%@@*=::                  </tspan>
      <tspan x="4" y="66">         @@@@@#+**+:                    </tspan>
      <tspan x="4" y="79.5">         %%@%+=*%*;                     </tspan>
      <tspan x="4" y="93">         *++*=;=+;:                     </tspan>
      <tspan x="4" y="106.5">         %++#*++**;.....                </tspan>
      <tspan x="4" y="120">         ++*%%%#** .                    </tspan>
      <tspan x="4" y="133.5">         ++**#@%=;                      </tspan>
      <tspan x="4" y="147">      =++**+*%%%#+=:                    </tspan>
      <tspan x="4" y="160.5">   +++++++****###****                   </tspan>
      <tspan x="4" y="174">=+++++++*+*+*+*******=..                </tspan>
      <tspan x="4" y="187.5">+****+++++*+********#*:.   +            </tspan>
      <tspan x="4" y="201">******++++****+*****##+;  ==            </tspan>
      <tspan x="4" y="214.5">***##***********#*##%#*+  =*            </tspan>
      <tspan x="4" y="228">*####********+**######*=+=*+*#*         </tspan>
      <tspan x="4" y="241.5">*#%%#*****#******##%##**#+*#**=         </tspan>
      <tspan x="4" y="255">*#%%*#***#**+****##%#*###=  +*+         </tspan>
      <tspan x="4" y="268.5">##%%************#*##**#= ++=**=         </tspan>
      <tspan x="4" y="282">####**+*#********###*+**++#*+*+         </tspan>
      <tspan x="4" y="295.5">*#****+***+*******##**##**%%#*+         </tspan>
      <tspan x="4" y="309">*#*+**+#*********##%**###%%#%%#         </tspan>
      <tspan x="4" y="322.5">*##**+*#*********##%#***++**+++         </tspan>
    </text>
  </g>

  <!-- Left Separator -->
  <line x1="18" y1="390" x2="318" y2="390" class="subtle-divider" />

  <!-- Contact Block -->
  <g transform="translate(24, 406)" class="term-text">
    <text x="0" y="14" class="accent-section">Contact</text>
    <text x="0" y="26" class="text-dim">──────────────────────────</text>
    <text x="0" y="48" class="text-dim">GitHub:</text>
    <text x="75" y="48" class="text-bright">eayushsingh</text>
    <text x="0" y="70" class="text-dim">LinkedIn:</text>
    <text x="75" y="70" class="text-bright">Ayush Singh</text>
    <text x="0" y="92" class="text-dim">LeetCode:</text>
    <text x="75" y="92" class="text-bright">eayushsingh</text>
  </g>

  <!-- ================= RIGHT: NEOFETCH SPECS & STATS ================= -->
  <g transform="translate(360, 40)" class="term-text">
    <!-- Identity Header -->
    <text x="0" y="16" class="accent-green" font-size="14" font-weight="600">ayushsingh</text>
    <text x="100" y="16" class="text-dim" font-size="11">@ github</text>
    <circle cx="165" cy="12" r="3" fill="#3fb950" />
    <text x="173" y="16" fill="#3fb950" font-size="10">online</text>
    <text x="0" y="28" class="text-dim">─────────────────────────────────────────────────</text>

    <!-- System Info -->
    <text x="0" y="48" class="accent-blue">OS:</text>
    <text x="90" y="48" class="text-bright">macOS / Linux</text>
    <text x="0" y="66" class="accent-blue">Host:</text>
    <text x="90" y="66" class="text-bright">Ayush Singh</text>
    <text x="0" y="84" class="accent-blue">Location:</text>
    <text x="90" y="84" class="text-bright">India 🇮🇳</text>
    <text x="0" y="102" class="accent-blue">IDE:</text>
    <text x="90" y="102" class="text-bright">VS Code</text>
    <text x="0" y="120" class="accent-blue">Role:</text>
    <text x="90" y="120" class="text-bright">AI Engineer · Full-Stack Developer</text>

    <!-- Languages.Programming -->
    <text x="0" y="146" class="accent-section">Languages.Programming</text>
    <text x="0" y="158" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="174" class="text-bright">Python · Java · JavaScript</text>
    <text x="0" y="190" class="text-bright">TypeScript · SQL</text>

    <!-- Languages.Framework -->
    <text x="0" y="214" class="accent-section">Languages.Framework</text>
    <text x="0" y="226" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="242" class="text-bright">Next.js · React · Spring Boot</text>
    <text x="0" y="258" class="text-bright">FastAPI</text>

    <!-- Data.Infrastructure -->
    <text x="0" y="282" class="accent-section">Data.Infrastructure</text>
    <text x="0" y="294" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="310" class="text-bright">PostgreSQL · Supabase · Redis</text>
    <text x="0" y="326" class="text-bright">Docker</text>

    <!-- Focus -->
    <text x="0" y="350" class="accent-section">Focus</text>
    <text x="0" y="362" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="378" class="text-bright">FinTech · AI · Backend</text>
    <text x="0" y="394" class="text-bright">Distributed Systems</text>

    <!-- GitHub Stats -->
    <text x="0" y="418" class="accent-section">GitHub Stats</text>
    <text x="0" y="430" class="text-dim">─────────────────────────────────────────────────</text>

    <text x="0" y="450" class="text-dim">Repos:</text>
    <text x="110" y="450" class="text-leader">································</text>
    <text x="430" y="450" class="accent-green">45</text>

    <text x="0" y="468" class="text-dim">Stars:</text>
    <text x="110" y="468" class="text-leader">································</text>
    <text x="430" y="468" class="accent-green">1</text>

    <text x="0" y="486" class="text-dim">Followers:</text>
    <text x="110" y="486" class="text-leader">································</text>
    <text x="430" y="486" class="accent-green">13</text>

    <text x="0" y="504" class="text-dim">Commits/yr:</text>
    <text x="110" y="504" class="text-leader">································</text>
    <text x="430" y="504" class="accent-green">LIVE</text>

    <text x="0" y="522" class="text-dim">Contribs/yr:</text>
    <text x="110" y="522" class="text-leader">································</text>
    <text x="430" y="522" class="accent-green">LIVE</text>
    <rect x="472" y="512" width="6.5" height="12" class="cursor" />
  </g>
</svg>
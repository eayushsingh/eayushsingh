  <circle cx="28" cy="16" r="3.5" fill="#ffbd2e" />
  <circle cx="40" cy="16" r="3.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="420" y="20" text-anchor="middle" class="title">ayushsingh ~</text>


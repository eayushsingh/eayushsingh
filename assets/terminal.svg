<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 670" width="100%" height="100%">
  <defs>
    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        fill: #c9d1d9;
      }
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 12.5px;
        font-weight: 500;
        fill: #8b949e;
      }
      .accent-blue { fill: #58a6ff; font-weight: 600; }
      .accent-green { fill: #3fb950; font-weight: 600; }
      .accent-purple { fill: #bc8cff; font-weight: 600; }
      .accent-yellow { fill: #d29922; font-weight: 600; }
      .accent-cyan { fill: #39c5cf; font-weight: 600; }
      .text-dim { fill: #6e7681; }
      .text-leader { fill: #30363d; }
      .text-bright { fill: #f0f6fc; font-weight: 500; }
      .ascii-art {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 10px;
        line-height: 12px;
        fill: #c9d1d9;
        white-space: pre;
      }
      .divider { stroke: #30363d; stroke-width: 1; }
      .cursor { fill: #58a6ff; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Window Outer Frame -->
  <rect x="1" y="1" width="878" height="668" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="878" height="36" rx="8" fill="#161b22" />
  <rect x="1" y="24" width="878" height="13" fill="#161b22" />
  <line x1="1" y1="37" x2="879" y2="37" class="divider" />

  <!-- Window Traffic Lights -->
  <circle cx="20" cy="19" r="5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="440" y="23" text-anchor="middle" class="title">ayushsingh ~</text>

  <!-- Vertical Splitter -->
  <line x1="350" y1="37" x2="350" y2="669" class="divider" />


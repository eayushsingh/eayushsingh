<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="100%" height="auto">
  <defs>
    <style>
      .term-text {
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        fill: #24292f;
      }
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 11.5px;
        font-weight: 500;
        fill: #57606a;
      }
      .accent-blue { fill: #0969da; font-weight: 500; }
      .accent-green { fill: #1a7f37; font-weight: 600; }
      .accent-section { fill: #0969da; font-weight: 600; }
      .text-dim { fill: #656d76; }
      .text-leader { fill: #d0d7de; }
      .text-bright { fill: #1f2328; }
      .ascii-art {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 9.5px;
        line-height: 12.8px;
        fill: #24292f;
        white-space: pre;
      }
      .divider { stroke: #d0d7de; stroke-width: 1; }
      .subtle-divider { stroke: #eaeef2; stroke-width: 1; }
      .cursor { fill: #1a7f37; animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="1" y="1" width="778" height="558" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1" />

  <!-- Minimal Header Bar -->
  <rect x="1" y="1" width="778" height="30" rx="6" fill="#f6f8fa" />
  <rect x="1" y="19" width="778" height="12" fill="#f6f8fa" />
  <line x1="1" y1="31" x2="779" y2="31" class="divider" />

  <!-- Subtle Traffic Lights -->
  <circle cx="16" cy="16" r="3.5" fill="#ff5f56" />
  <circle cx="28" cy="16" r="3.5" fill="#ffbd2e" />
  <circle cx="40" cy="16" r="3.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="390" y="20" text-anchor="middle" class="title">ayushsingh ~</text>

  <!-- Vertical Splitter -->
  <line x1="290" y1="31" x2="290" y2="559" class="divider" />

  <!-- ================= LEFT: FULL ASCII PORTRAIT & CONTACT ================= -->
  <g transform="translate(10, 40)">
    <text class="ascii-art" xml:space="preserve">      <tspan x="2" y="12">          ;=**=++=+=;;;               </tspan>
      <tspan x="2" y="25">          ;+==;*+=++;::               </tspan>
      <tspan x="2" y="38">         %@%@@@@%*+;:::               </tspan>
      <tspan x="2" y="51">         %%%@@%@@#=::                 </tspan>
      <tspan x="2" y="64">         @@@@%****:                   </tspan>
      <tspan x="2" y="77">         #%@*=+#*;                    </tspan>
      <tspan x="2" y="90">         ++*=;=+;:                    </tspan>
      <tspan x="2" y="103">         #***++**=.....               </tspan>
      <tspan x="2" y="116">         ++#%%#** .                   </tspan>
      <tspan x="2" y="129">         ++*#%@+;                     </tspan>
      <tspan x="2" y="142">      ++**+*#%%#+=:                   </tspan>
      <tspan x="2" y="155">   ++++++*#**##*****                  </tspan>
      <tspan x="2" y="168">=+++++++++***+******=..               </tspan>
      <tspan x="2" y="181">+****++++**********#*:.               </tspan>
      <tspan x="2" y="194">******++++***+*****##+;  =            </tspan>
      <tspan x="2" y="207">***##***+********##%#*=  =            </tspan>
      <tspan x="2" y="220">*##%#**********######*=++*+#*         </tspan>
      <tspan x="2" y="233">*#%%#**********#*#%##**#+***+         </tspan>
      <tspan x="2" y="246">*#%%*#*****+**+*##%#*##*   **         </tspan>
      <tspan x="2" y="259">##%%****#********##**#= *+=#+         </tspan>
      <tspan x="2" y="272">####*+**#*******###*+**++**++         </tspan>
      <tspan x="2" y="285">*#***+****+******##**##*#%%#+         </tspan>
      <tspan x="2" y="298">*#*+*++#**+******#%**###%%#%#         </tspan>
      <tspan x="2" y="311">*##**+****+******#%#***++#+++         </tspan>
    </text>
  </g>

  <!-- Left Separator -->
  <line x1="16" y1="380" x2="274" y2="380" class="subtle-divider" />

  <!-- Contact Block -->
  <g transform="translate(20, 396)" class="term-text">
    <text x="0" y="14" class="accent-section">Contact</text>
    <text x="0" y="26" class="text-dim">──────────────────────</text>
    <text x="0" y="46" class="text-dim">GitHub:</text>
    <text x="70" y="46" class="text-bright">eayushsingh</text>
    <text x="0" y="66" class="text-dim">LinkedIn:</text>
    <text x="70" y="66" class="text-bright">Ayush Singh</text>
    <text x="0" y="86" class="text-dim">LeetCode:</text>
    <text x="70" y="86" class="text-bright">eayushsingh</text>
  </g>

  <!-- ================= RIGHT: NEOFETCH SPECS & STATS ================= -->
  <g transform="translate(310, 40)" class="term-text">
    <!-- Identity Header -->
    <text x="0" y="16" class="accent-green" font-size="13.5" font-weight="600">ayushsingh</text>
    <text x="95" y="16" class="text-dim" font-size="11">@ github</text>
    <circle cx="158" cy="12" r="3" fill="#1a7f37" />
    <text x="166" y="16" fill="#1a7f37" font-size="10">online</text>
    <text x="0" y="28" class="text-dim">─────────────────────────────────────────────────</text>

    <!-- System Info -->
    <text x="0" y="46" class="accent-blue">OS:</text>
    <text x="85" y="46" class="text-bright">macOS / Linux</text>
    <text x="0" y="64" class="accent-blue">Host:</text>
    <text x="85" y="64" class="text-bright">Ayush Singh</text>
    <text x="0" y="82" class="accent-blue">Location:</text>
    <text x="85" y="82" class="text-bright">India 🇮🇳</text>
    <text x="0" y="100" class="accent-blue">IDE:</text>
    <text x="85" y="100" class="text-bright">VS Code</text>
    <text x="0" y="118" class="accent-blue">Role:</text>
    <text x="85" y="118" class="text-bright">AI Engineer · Full-Stack Developer</text>

    <!-- Languages.Programming -->
    <text x="0" y="142" class="accent-section">Languages.Programming</text>
    <text x="0" y="154" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="170" class="text-bright">Python · Java · JavaScript</text>
    <text x="0" y="186" class="text-bright">TypeScript · SQL</text>

    <!-- Languages.Framework -->
    <text x="0" y="210" class="accent-section">Languages.Framework</text>
    <text x="0" y="222" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="238" class="text-bright">Next.js · React · Spring Boot</text>
    <text x="0" y="254" class="text-bright">FastAPI</text>

    <!-- Data.Infrastructure -->
    <text x="0" y="278" class="accent-section">Data.Infrastructure</text>
    <text x="0" y="290" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="306" class="text-bright">PostgreSQL · Supabase · Redis · Docker</text>

    <!-- Focus -->
    <text x="0" y="330" class="accent-section">Focus</text>
    <text x="0" y="342" class="text-dim">─────────────────────────────────────────────────</text>
    <text x="0" y="358" class="text-bright">FinTech · AI · Backend</text>
    <text x="0" y="374" class="text-bright">Distributed Systems · Product Engineering</text>

    <!-- GitHub Stats -->
    <text x="0" y="398" class="accent-section">GitHub Stats</text>
    <text x="0" y="410" class="text-dim">─────────────────────────────────────────────────</text>

    <text x="0" y="428" class="text-dim">Repos:</text>
    <text x="100" y="428" class="text-leader">································</text>
    <text x="400" y="428" class="accent-green">45</text>

    <text x="0" y="446" class="text-dim">Stars:</text>
    <text x="100" y="446" class="text-leader">································</text>
    <text x="400" y="446" class="accent-green">1</text>

    <text x="0" y="464" class="text-dim">Followers:</text>
    <text x="100" y="464" class="text-leader">································</text>
    <text x="400" y="464" class="accent-green">13</text>

    <text x="0" y="482" class="text-dim">Commits/yr:</text>
    <text x="100" y="482" class="text-leader">································</text>
    <text x="400" y="482" class="accent-green">LIVE</text>

    <text x="0" y="500" class="text-dim">Contribs/yr:</text>
    <text x="100" y="500" class="text-leader">································</text>
    <text x="400" y="500" class="accent-green">LIVE</text>
    <rect x="440" y="490" width="6.5" height="12" class="cursor" />
  </g>
</svg>